name: Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*", "testpypi-v*"]
  pull_request:
    paths:
      - "meson.build"
      - "pyproject.toml"
      - "src/**"
      - "python/**"
      - ".github/workflows/wheels.yml"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # manylinux x86_64
          - ubuntu-24.04-arm   # manylinux aarch64
          - macos-15-intel     # macOS x86_64
          - macos-14           # macOS arm64
          - windows-latest     # Windows AMD64
    steps:
      - uses: actions/checkout@v4

      # gcc, GSL >= 2.2 (gsl_multifit_nlinear) and OpenBLAS (LAPACK) for the
      # UCRT runtime that python.org Python also uses.
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gsl
            mingw-w64-ucrt-x86_64-openblas

      # Put the UCRT64 toolchain first, and Git's bash (needed by the header
      # generator scripts) ahead of the WSL bash in System32.
      - name: Add toolchain to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Linux and macOS install their dependencies in cibuildwheel's
      # before-all (.github/scripts/install_deps.sh).
      - uses: pypa/cibuildwheel@v3.2.1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME#testpypi-}" != "v$(cat VERSION)" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"
            exit 1
          fi

      # meson dist configures the project, so it needs the build dependencies
      - name: Install GSL and LAPACK
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev liblapack-dev

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Uploads use PyPI trusted publishing (no API token): the pypi and testpypi
  # environments must match the trusted publishers registered on PyPI/TestPyPI.
  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pvcraze
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Trial upload: push a testpypi-v<VERSION> tag, or start the workflow by
  # hand from the Actions tab (Run workflow, once it is on master)
  publish-testpypi:
    name: Publish to TestPyPI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/testpypi-v'))
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pvcraze
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

[build-system]
requires = ["meson-python>=0.15", "meson>=1.1", "numpy>=2.0"]
build-backend = "mesonpy"

[project]
name = "pvcraze"
dynamic = ["version"]
description = "Photo-Voltaic CuRve AnalyZEr: extended solar cell parameters and IV curve models"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["COPYING"]
authors = [{ name = "B. E. Pieters" }, { name = "J. Körtgen" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.25"]
keywords = ["photovoltaics", "solar-cell-parameters", "IV curve", "IEC60891"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = ["*t-*", "*-musllinux_*"]
test-requires = ["pytest>=7"]
test-command = "pytest {project}/tests/python"

[tool.cibuildwheel.linux]
before-all = "bash .github/scripts/install_deps.sh"

[tool.cibuildwheel.macos]
# GSL is built statically into $GSL_PREFIX; LAPACK comes from Accelerate.
environment = { GSL_PREFIX = "/tmp/gsl", PKG_CONFIG_PATH = "/tmp/gsl/lib/pkgconfig" }
before-all = "bash .github/scripts/install_deps.sh"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# Built with the MSYS2 UCRT64 gcc, GSL and OpenBLAS (see
# .github/workflows/wheels.yml); delvewheel copies their DLLs into the wheel.
environment = { CC = "gcc" }
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
